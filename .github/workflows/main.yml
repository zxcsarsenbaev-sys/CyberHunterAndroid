name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          unzip -q CyberHunterAndroid-GitHub-APK.zip -d package
          unzip -q package/CyberHunterAndroid-source.zip -d project

      - name: Build APK
        run: |
          cd project/CyberHunterAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CyberHunter-APK
          path: project/CyberHunterAndroid/app/build/outputs/apk/debug/app-debug.apk
          
